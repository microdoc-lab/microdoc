Domains:
- Name: microdoc.doc
  RootFolder: ~/../microdoc.doc
  Background:  _domain+background.jpg
  IsCaseSensitive: false
  TrackTagMoves: false
  Documents: [ vision, gamedesign ,techdesign, usecases, testing ]
  DocumentOptions:
  - { Name: vision, 		Color: lightgreen }
  - { Name: gamedesign, 	Color: lightblue }
  - { Name: techdesign, 	Color: yellow }
  - { Name: usecases, 		Color: red }
  - { Name: a, 				Color: cyan }
  DocumentLevelSecurity: false

- Name: TEST
  RootFolder: ~/../test.doc
  Background:  _domain+background.png
  IsCaseSensitive: true
  TrackTagMoves: true
  Documents: [ vision, gamedesign, techdesign, usecases, testing, tools ]
  DocumentOptions:
  - { Name: usecases, 		Color: lightgreen }
  DocumentLevelSecurity: false

SimpleLogin: true
DomainLevelSecurity: false
Users:
- { Email: '*',			Roles: rwa }
